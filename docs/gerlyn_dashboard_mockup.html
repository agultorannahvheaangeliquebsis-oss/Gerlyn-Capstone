<title>Gerlyn Variety Store — Dashboard</title>
<style>
:root{
  --bg:#f1f4f0;
  --surface:#ffffff;
  --surface-2:#f7faf6;
  --border:#e2e8df;
  --border-strong:#d3dccf;
  --ink:#122019;
  --ink-muted:#59685e;
  --ink-faint:#8b988f;

  --accent:#1f8a56;
  --accent-ink:#116343;
  --accent-soft:#e6f3ec;
  --on-accent:#ffffff;

  --seg-1:#0f5c37;
  --seg-2:#3d9e6b;
  --seg-3:#8ecbaa;

  --ok:#1f8a56;
  --ok-soft:#e6f3ec;
  --warn:#9a6a12;
  --warn-soft:#fbf0d9;
  --warn-line:#e0b458;
  --danger:#ad2a1f;
  --danger-soft:#fbe8e5;

  --grid:#dbe3d8;
  --shadow:0 1px 2px rgba(18,32,25,.05), 0 6px 18px rgba(18,32,25,.05);
  --pop:0 4px 8px rgba(18,32,25,.06), 0 18px 44px rgba(18,32,25,.16);

  --font-sans:"Segoe UI Variable Display","Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,system-ui,sans-serif;
  --font-mono:ui-monospace,"Cascadia Mono",Consolas,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b100d; --surface:#121a15; --surface-2:#0e1511;
    --border:#243029; --border-strong:#2f3d34;
    --ink:#e9f0ea; --ink-muted:#93a498; --ink-faint:#6a7a6f;
    --accent:#3fc281; --accent-ink:#7fe0b0; --accent-soft:rgba(63,194,129,.12); --on-accent:#08110c;
    --seg-1:#2f9e68; --seg-2:#5ec994; --seg-3:#a7e6c5;
    --ok:#3fc281; --ok-soft:rgba(63,194,129,.12);
    --warn:#e2b158; --warn-soft:rgba(226,177,88,.13); --warn-line:#a37e2e;
    --danger:#f0796c; --danger-soft:rgba(240,121,108,.13);
    --grid:#233029;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.3);
    --pop:0 4px 10px rgba(0,0,0,.4), 0 20px 50px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --bg:#0b100d; --surface:#121a15; --surface-2:#0e1511;
  --border:#243029; --border-strong:#2f3d34;
  --ink:#e9f0ea; --ink-muted:#93a498; --ink-faint:#6a7a6f;
  --accent:#3fc281; --accent-ink:#7fe0b0; --accent-soft:rgba(63,194,129,.12); --on-accent:#08110c;
  --seg-1:#2f9e68; --seg-2:#5ec994; --seg-3:#a7e6c5;
  --ok:#3fc281; --ok-soft:rgba(63,194,129,.12);
  --warn:#e2b158; --warn-soft:rgba(226,177,88,.13); --warn-line:#a37e2e;
  --danger:#f0796c; --danger-soft:rgba(240,121,108,.13);
  --grid:#233029;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 28px rgba(0,0,0,.3);
  --pop:0 4px 10px rgba(0,0,0,.4), 0 20px 50px rgba(0,0,0,.55);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);color:var(--ink);font-family:var(--font-sans);
  font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;
}
.wrap{max-width:1200px;margin:0 auto;padding:24px 22px 56px;display:flex;flex-direction:column;gap:14px;}
a{color:inherit;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px;}

/* ---------- header ---------- */
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--border);}
.brand-name{font-size:12px;font-weight:600;color:var(--ink-faint);margin:0 0 4px;}
.greet{font-size:22px;font-weight:700;letter-spacing:-.015em;margin:0;}
.greet-sub{margin:3px 0 0;font-size:12.5px;color:var(--ink-muted);}
.topbar-tools{display:flex;align-items:center;gap:8px;position:relative;}

.chip{
  display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 13px;
  border:1px solid var(--border);background:var(--surface);border-radius:9px;
  font-size:12.5px;font-weight:600;color:var(--ink-muted);cursor:pointer;font-family:inherit;
}
.chip:hover{border-color:var(--border-strong);color:var(--ink);}
.avatar{width:36px;height:36px;border-radius:9px;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;}
.ico{width:15px;height:15px;flex:0 0 auto;}

/* date control */
.datectl{display:flex;align-items:stretch;border:1px solid var(--border);background:var(--surface);border-radius:9px;position:relative;}
.datectl button{
  display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;
  background:none;border:none;font-family:inherit;font-size:12.5px;font-weight:600;
  color:var(--ink);cursor:pointer;white-space:nowrap;
}
.datectl button:hover{color:var(--accent-ink);}
.datectl .sep{width:1px;background:var(--border);}
