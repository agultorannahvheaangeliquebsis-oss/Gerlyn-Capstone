{% extends "public_base.html" %}
{% load static %}
{% block title %}Sign In — Gerlyn Variety Store{% endblock %}

{% block content %}
<div class="shop-wrap section" style="max-width:420px;">
  <div style="text-align:center; margin-bottom:24px;">
    <span class="brand-mark" style="width:56px; height:56px; border-radius:16px; margin:0 auto 12px;"><img src="{% static 'img/logo.jpg' %}" alt="Gerlyn Variety Store"></span>
    <h2>Welcome back</h2>
    <p class="gv-meta mb-0">Sign in to your Gerlyn Variety Store account.</p>
  </div>

  <div class="card card-pad">
    <form method="POST" class="stack">
      {% csrf_token %}
      <div class="field field-float">
        <input id="username" type="text" name="username" value="{{ username }}" placeholder=" " required autofocus{% if error %} class="is-invalid" aria-invalid="true"{% endif %}>
        <label for="username">Username</label>
      </div>
      <div class="field field-float">
        <input id="password" type="password" name="password" placeholder=" " required{% if error %} class="is-invalid" aria-invalid="true" aria-describedby="password-error"{% endif %}>
        <label for="password">Password</label>
      </div>
      {% if error %}<p class="field-error" id="password-error" role="alert">{{ error }}</p>{% endif %}
      <button type="submit" class="btn btn-primary" style="width:100%;">Sign In</button>
    </form>
    <p class="gv-meta mt-4" style="text-align:center; margin-bottom:0;">
      New here? <a href="{% url 'accounts:register' %}">Create an account</a>
    </p>
  </div>
</div>
{% endblock %}
