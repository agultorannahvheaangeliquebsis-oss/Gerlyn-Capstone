{% extends "public_base.html" %}
{% load static %}
{% block title %}Create Account — Gerlyn Variety Store{% endblock %}

{% block content %}
<div class="shop-wrap section" style="max-width:480px;">
  <div style="text-align:center; margin-bottom:24px;">
    <span class="brand-mark" style="width:56px; height:56px; border-radius:16px; margin:0 auto 12px;"><img src="{% static 'img/logo.jpg' %}" alt="Gerlyn Variety Store"></span>
    <h2>Create your account</h2>
    <p class="gv-meta mb-0">Shop online and track your orders.</p>
  </div>

  <div class="card card-pad">
    <form method="POST" class="stack">
      {% csrf_token %}
      <div class="grid-2" style="grid-template-columns:1fr 1fr;">
        <div class="field">
          <label for="first_name">First Name</label>
          <input id="first_name" type="text" name="first_name" placeholder="Juan" required>
        </div>
        <div class="field">
          <label for="last_name">Last Name</label>
          <input id="last_name" type="text" name="last_name" placeholder="Dela Cruz" required>
        </div>
      </div>
      <div class="field">
        <label for="username">Username</label>
        <input id="username" type="text" name="username" placeholder="juandelacruz" required>
      </div>
      <div class="field">
        <label for="email">Email Address</label>
        <input id="email" type="email" name="email" placeholder="juan@example.com" required>
      </div>
      <div class="field">
        <label for="contact_number">Contact Number</label>
        <input id="contact_number" type="text" name="contact_number" placeholder="09XX XXX XXXX">
      </div>
      <div class="field">
        <label for="address">Address</label>
        <textarea id="address" name="address" rows="2" placeholder="Baliuag, Bulacan"></textarea>
      </div>
      <div class="field">
        <label for="password1">Password</label>
        <input id="password1" type="password" name="password1" placeholder="••••••••" required>
      </div>
      <div class="field">
        <label for="password2">Confirm Password</label>
        <input id="password2" type="password" name="password2" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Create Account</button>
    </form>
    <p class="gv-meta mt-4" style="text-align:center; margin-bottom:0;">
      Already have an account? <a href="{% url 'login' %}">Sign in</a>
    </p>
  </div>
</div>
{% endblock %}
