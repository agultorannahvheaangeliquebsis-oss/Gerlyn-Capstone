{% load i18n_extra %}
<!-- ── Shared address picker: cascading Region/Province/City/Barangay
     dropdowns (bundled PSGC data, no external calls) plus a typed
     "Full Address" line. Reused by the Addresses page (add + edit) and the
     registration form. One instance per page — openAddressPicker()
     re-targets it per use. ── -->
<div class="modal-overlay" id="address-picker-modal">
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="address-picker-title" style="max-width:640px;">
    <div class="modal-head">
      <h2 id="address-picker-title">{% t "Add Address" %}</h2>
      <button type="button" class="modal-close" onclick="closeAddressPicker()" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px;"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <form method="post" id="address-picker-form">
      {% csrf_token %}
      <div class="modal-body">

        <div class="type-pill-group">
          <input type="hidden" name="type" id="ap-type-input" value="HOME">
          <button type="button" class="type-pill is-selected" data-type="HOME" onclick="AddressPicker.selectType(this)">{% t "Home" %}</button>
          <button type="button" class="type-pill" data-type="WORK" onclick="AddressPicker.selectType(this)">{% t "Work" %}</button>
          <button type="button" class="type-pill" data-type="OTHER" onclick="AddressPicker.selectType(this)">{% t "Other" %}</button>
        </div>

        <div class="edit-grid">
          <div class="field">
            <label for="ap-region">{% t "Region" %}</label>
            <select name="region" id="ap-region"><option value="">Select region…</option></select>
          </div>
          <div class="field">
            <label for="ap-province">{% t "Province" %}</label>
            <select name="province" id="ap-province" disabled><option value="">Select province…</option></select>
          </div>
          <div class="field">
            <label for="ap-city">{% t "City / Municipality" %}</label>
            <select name="city" id="ap-city" disabled><option value="">Select city/municipality…</option></select>
          </div>
          <div class="field">
            <label for="ap-barangay">{% t "Barangay" %}</label>
            <select name="barangay" id="ap-barangay" disabled><option value="">Select barangay…</option></select>
          </div>
        </div>

        <div class="field ap-street-field">
          <label for="ap-street-input">{% t "Street name, Building, House No." %}</label>
          <input type="text" name="street_detail" id="ap-street-input" placeholder="Select a barangay first" disabled autocomplete="off">
        </div>

        <div class="field" style="margin-top:10px;">
          <label for="ap-text-input">{% t "Full Address" %}</label>
          <textarea name="text" id="ap-text-input" rows="2" placeholder="House no., street, barangay, city" required></textarea>
        </div>
      </div>

      {% comment %}
      The full address line is what gets saved. save() blocks on it being
      non-empty and the server (address_create / address_edit, register_view)
      re-checks it, composing it from the dropdowns as a fallback.
      {% endcomment %}
      <p class="ap-error" id="ap-error" role="alert" hidden
         style="margin:0 20px; color:var(--danger-fg,#9A1C12); font-size:12.5px; line-height:1.45;"></p>

      <div class="modal-foot">
        <button type="button" class="btn btn-sm" onclick="closeAddressPicker()">{% t "Cancel" %}</button>
        <button type="button" class="btn btn-sm btn-primary" onclick="AddressPicker.save()">{% t "Save Address" %}</button>
      </div>
    </form>
  </div>
</div>

<script>
window.ADDRESS_PICKER_URLS = {
  regions: "{% url 'accounts:geo_regions' %}",
  provinces: "{% url 'accounts:geo_provinces' %}",
  cities: "{% url 'accounts:geo_cities' %}",
  barangays: "{% url 'accounts:geo_barangays' %}"
};
function closeAddressPicker() { AddressPicker.close(); }
</script>
