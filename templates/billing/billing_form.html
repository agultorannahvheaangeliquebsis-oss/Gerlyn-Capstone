<!DOCTYPE html>
<html>
<head><title>Record Payment</title></head>
<body>
    <h2>Record Payment for Transaction #{{ transaction.id }}</h2>
    <p>Amount Due: {{ transaction.total_amount }}</p>
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        <label>Payment Method</label>
        <select name="payment_method">
            <option value="Cash">Cash</option>
            <option value="GCash">GCash</option>
            <option value="Card">Card</option>
            <option value="Bank Transfer">Bank Transfer</option>
        </select><br><br>

        <label>Reference Number (optional)</label>
        <input type="text" name="reference_number"><br><br>

        <label>Proof of Payment (optional)</label>
        <input type="file" name="proof_of_payment" accept="image/*"><br><br>

        <button type="submit">Save</button>
    </form>
</body>
</html>
