{% block extra_css %}
<style>
    .hero-section { position: relative; overflow: hidden; }

    .hero-slide {
        display: none;
        animation: fadeIn 0.5s ease-in-out;
    }
    .hero-slide.active { display: block; }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateX(20px); }
        to   { opacity: 1; transform: translateX(0); }
    }

    .hero-nav-btn {
        position: absolute;
        top: 50%;
        transform: translateY(-50%);
        background: rgba(255,255,255,0.2);
        border: none;
        color: white;
        width: 36px; height: 36px;
        border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        cursor: pointer;
        z-index: 10;
        transition: background 0.2s;
    }
    .hero-nav-btn:hover { background: rgba(255,255,255,0.35); }
    .hero-nav-btn.prev { left: 16px; }
    .hero-nav-btn.next { right: 16px; }

    .carousel-dots { text-align: center; padding: 18px 0 8px; }
    .carousel-dots .dot {
        width: 10px; height: 10px;
        border-radius: 5px;
        background: rgba(255,255,255,0.4);
        display: inline-block;
        margin: 0 3px;
        transition: all 0.3s;
        cursor: pointer;
    }
    .carousel-dots .dot.active {
        background: white;
        width: 24px;
    }

    .info-card {
        background: #edf7f1;
        border-radius: 12px;
        padding: 16px 20px;
        display: flex;
        align-items: center;
        gap: 14px;
    }
    .info-card-icon {
        background: white;
        border-radius: 50%;
        width: 40px; height: 40px;
        display: flex; align-items: center; justify-content: center;
        color: var(--gerlyn-green);
        flex-shrink: 0;
    }

    .category-icon-circle {
        width: 64px; height: 64px;
        background: #edf7f1;
        border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-size: 1.6rem;
        margin: 0 auto 10px;
    }

    .flash-section {
        border: 1px solid #eee;
        border-radius: 16px;
        padding: 20px;
    }
    .countdown-box {
        background: var(--gerlyn-green);
        color: white;
        border-radius: 6px;
        padding: 2px 8px;
        font-weight: 700;
        font-size: 0.9rem;
        min-width: 30px;
        text-align: center;
    }
    .discount-badge {
        position: absolute;
        top: 8px; left: 8px;
        background: #e53935;
        color: white;
        font-size: 0.7rem;
        font-weight: 700;
        padding: 2px 6px;
        border-radius: 4px;
    }
</style>
{% endblock %}
