{% load i18n_extra %}
<script>
var pwaBtn = document.getElementById('pwa-action-btn');
var pwaStatusMsg = document.getElementById('pwa-status-msg');
var pwaIosBox = document.getElementById('ios-instructions');

function refreshPwaButtonLabel() {
  pwaBtn.textContent = window.PWA.isInstalled() ? '{% t "Update" %}' : '{% t "Download" %}';
}

document.addEventListener('DOMContentLoaded', refreshPwaButtonLabel);
document.addEventListener('pwa:installable', refreshPwaButtonLabel);
document.addEventListener('pwa:installed', function () {
  refreshPwaButtonLabel();
  pwaStatusMsg.textContent = '{% t "Installed! You can now open this from your home screen." %}';
});

function handlePwaAction() {
  pwaStatusMsg.textContent = '';
  if (window.PWA.isInstalled()) {
    doPwaUpdate();
  } else {
    doPwaInstall();
  }
}

function doPwaInstall() {
  if (window.PWA.isIOS()) {
    pwaIosBox.style.display = 'block';
    return;
  }
  if (!window.PWA.canPromptInstall()) {
    pwaStatusMsg.textContent = '{% t "Your browser does not support installing this app, or it is already installed." %}';
    return;
  }
  window.PWA.promptInstall().then(function (outcome) {
    if (outcome === 'accepted') {
      pwaStatusMsg.textContent = '{% t "Installing…" %}';
    }
    refreshPwaButtonLabel();
  });
}

function doPwaUpdate() {
  pwaBtn.disabled = true;
  pwaStatusMsg.textContent = '{% t "Checking for updates…" %}';
  window.PWA.checkForUpdate().then(function (result) {
    pwaBtn.disabled = false;
    if (result.status === 'update-found') {
      pwaStatusMsg.textContent = '{% t "Update found — refreshing…" %}';
      window.PWA.activateUpdate(result.registration);
    } else if (result.status === 'up-to-date') {
      pwaStatusMsg.textContent = '{% t "You are already up to date." %}';
    } else {
      pwaStatusMsg.textContent = '{% t "Could not check for updates right now." %}';
    }
  });
}
</script>
