{% extends "internal_base.html" %}
{% block title %}{% if category %}Edit{% else %}Add{% endif %} Category{% endblock %}
{% block page_subtitle %}Catalog{% endblock %}

{% block content %}
<div class="page-head">
  <div>
    <a class="back-link" href="{% url 'category_list' %}">Categories</a>
    <h1 class="mt-2">{% if category %}Edit{% else %}Add{% endif %} Category</h1>
  </div>
</div>

<div class="card card-pad" style="max-width:560px;">
  <form method="POST" class="stack">
    {% csrf_token %}
    <div class="field">
      <label for="category_name">Category Name</label>
      <input id="category_name" type="text" name="category_name"
             value="{{ category.category_name|default:'' }}" placeholder="Canned Goods" required autofocus>
    </div>
    <div class="field">
      <label for="description">Description <span class="gv-meta">— optional</span></label>
      <textarea id="description" name="description" rows="2"
                placeholder="What belongs in this category?">{{ category.description|default:'' }}</textarea>
    </div>
    <div class="row mt-2">
      <button type="submit" class="btn btn-primary">Save Category</button>
      <a href="{% url 'category_list' %}" class="btn">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
