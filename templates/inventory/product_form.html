<!DOCTYPE html>
<html>
<head><title>{% if product %}Edit{% else %}Add{% endif %} Product</title></head>
<body>
    <h2>{% if product %}Edit{% else %}Add{% endif %} Product</h2>
    <form method="POST">
        {% csrf_token %}
        <label>SKU Code</label>
        <input type="text" name="sku_code" value="{{ product.sku_code|default:'' }}" required><br><br>

        <label>Product Name</label>
        <input type="text" name="product_name" value="{{ product.product_name|default:'' }}" required><br><br>

        <label>Category</label>
        <select name="category">
            {% for category in categories %}
            <option value="{{ category.id }}" {% if product.category_id == category.id %}selected{% endif %}>
                {{ category.category_name }}
            </option>
            {% endfor %}
        </select><br><br>

        <label>Unit of Measure</label>
        <select name="unit_of_measure">
            <option value="Sack" {% if product.unit_of_measure == "Sack" %}selected{% endif %}>Sack</option>
            <option value="Kilo" {% if product.unit_of_measure == "Kilo" %}selected{% endif %}>Kilo</option>
            <option value="Piece" {% if product.unit_of_measure == "Piece" %}selected{% endif %}>Piece</option>
        </select><br><br>

        <label>Unit Price</label>
        <input type="number" step="0.01" name="unit_price" value="{{ product.unit_price|default:'' }}" required><br><br>

        <button type="submit">Save</button>
    </form>
</body>
</html>
