{% extends "internal_base.html" %}
{% block title %}{% if product %}Edit{% else %}Add{% endif %} Product{% endblock %}

{% block content %}
<h4 class="fw-bold mb-4">{% if product %}Edit{% else %}Add{% endif %} Product</h4>

<div class="stat-card bg-white p-4" style="max-width: 600px;">
    <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label fw-semibold">SKU Code</label>
            <input type="text" name="sku_code" class="form-control" value="{{ product.sku_code|default:'' }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label fw-semibold">Product Name</label>
            <input type="text" name="product_name" class="form-control" value="{{ product.product_name|default:'' }}" required>
        </div>
        <div class="mb-3">
            <label class="form-label fw-semibold">Category</label>
            <select name="category" class="form-select">
                {% for category in categories %}
                <option value="{{ category.id }}" {% if product.category_id == category.id %}selected{% endif %}>
                    {{ category.category_name }}
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label fw-semibold">Unit of Measure</label>
            <select name="unit_of_measure" class="form-select">
                <option value="Sack" {% if product.unit_of_measure == "Sack" %}selected{% endif %}>Sack</option>
                <option value="Kilo" {% if product.unit_of_measure == "Kilo" %}selected{% endif %}>Kilo</option>
                <option value="Piece" {% if product.unit_of_measure == "Piece" %}selected{% endif %}>Piece</option>
            </select>
        </div>
     <div class="mb-4">
    <label class="form-label fw-semibold">Unit Price</label>
        <div class="input-group">
            <span class="input-group-text">₱</span>
            <input type="number" step="0.01" name="unit_price" class="form-control" value="{{ product.unit_price|default:'' }}" required>
        </div>
    </div>

    <div class="mb-4">
        <label class="form-label fw-semibold">Wholesale Price (optional)</label>
        <div class="input-group">
            <span class="input-group-text">₱</span>
            <input type="number" step="0.01" name="wholesale_price" class="form-control" value="{{ product.wholesale_price|default:'' }}">
        </div>
    </div>
        <button type="submit" class="btn btn-gerlyn px-4">Save</button>
        <a href="{% url 'product_list' %}" class="btn btn-outline-secondary px-4">Cancel</a>
    </form>
</div>
{% endblock %}
