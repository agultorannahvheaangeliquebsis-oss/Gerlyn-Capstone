<!-- orders/templates/orders/cart.html -->
{% extends "base.html" %}
{% block content %}
<h1>Your Cart</h1>
{% for item in items %}
  <p>{{ item.product.product_name }} x {{ item.quantity }} = ₱{{ item.subtotal }}</p>
{% endfor %}
<p><strong>Total: ₱{{ total }}</strong></p>

<form method="post" action="{% url 'orders:checkout' %}">
  {% csrf_token %}
  <select name="mode_of_payment">
    <option value="Cash">Cash</option>
    <option value="GCash">GCash</option>
    <option value="Card">Card</option>
  </select>
  <button type="submit">Place Order</button>
</form>
{% endblock %}
