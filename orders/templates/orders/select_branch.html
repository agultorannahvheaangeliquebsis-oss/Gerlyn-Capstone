<!-- orders/templates/orders/select_branch.html -->
{% extends "base.html" %}
{% block content %}
<h1>Choose a Branch</h1>
<form method="post">
  {% csrf_token %}
  <select name="branch_id" required>
    {% for branch in branches %}
      <option value="{{ branch.id }}">{{ branch.branch_name }}</option>
    {% endfor %}
  </select>
  <button type="submit">Continue</button>
</form>
{% endblock %}
